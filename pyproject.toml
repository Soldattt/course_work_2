[project]
name = "coursr-work-2"
version = "0.1.0"
description = ""
authors = [
    {name = "Roman_Soldatov",email = "soldatov.rom4ik@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.33.1,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.20.0,<2.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "black (>=26.3.1,<27.0.0)"
]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.mypy]
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true
exclude = ['venv', 'tests']

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = "'.direnv', '.eggs', '.git', '.mypy_cache', '.pytest_cache',  '.venv', '.vscode', '__pypackages__', 'venv'"

[tool.isort]
# максимальная длина строки
line_length = 119